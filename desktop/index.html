<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e12" />
    <meta name="description" content="A self-hosted story-writing IDE — chapters, the page, the Muse." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Katha" />
    <title>Katha</title>
    <script>
      // Set the theme before first paint (no flash): stored choice, else the OS.
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem('katha.theme') || 'null')
          var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
          var theme = (pref === 'hermes' || pref === 'paper' || pref === 'slate')
            ? pref : (light ? 'paper' : 'hermes')
          document.documentElement.dataset.theme = theme
          var color = { hermes: '#0e0e12', paper: '#f6f1e7', slate: '#0f1419' }[theme]
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta && color) meta.setAttribute('content', color)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
