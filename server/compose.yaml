# Katha Archive — FastAPI serves the API *and* the built PWA client from a
# single port. Runs on the Pi 5; reach it over Tailscale (D12) and use
# `tailscale serve` for the HTTPS origin a PWA needs to install.
name: katha-archive

services:
  archive:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: katha-archive
    restart: unless-stopped
    ports:
      - "4901:4901"
    environment:
      # Archive root + index location inside the container (bind-mounted below).
      KATHA_ARCHIVE: /data/archive
      KATHA_DATA: /data/index
      # The built client (copied into the image).
      KATHA_WEB_DIR: /srv/web
    volumes:
      # md archive (source of truth) + sqlite index both persist on the host.
      - ./archive:/data/archive
      - ./data:/data/index
    # healthcheck mirrors the heartbeat endpoint.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4901/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
